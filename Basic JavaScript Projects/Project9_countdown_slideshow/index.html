<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project 9 - Countdown & Slideshow</title>
  <style>
    /* Basic styling for the slideshow */
    .slide {
      width: 300px;
      height: 200px;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-family: sans-serif;
    }

    .slide.active {
      display: flex;
    }

    #slide1 { background-color: tomato; }
    #slide2 { background-color: steelblue; }
    #slide3 { background-color: seagreen; }
  </style>
</head>
<body>
  <h1>Countdown & Slideshow</h1>

  <h2>Countdown</h2>
  <button onclick="countdown(5)">Start Countdown (5s)</button>
  <p id="countdownResult"></p>

  <h2>Slideshow</h2>
  <div class="slide active" id="slide1">Slide 1</div>
  <div class="slide" id="slide2">Slide 2</div>
  <div class="slide" id="slide3">Slide 3</div>

  <script src="JS/main.js"></script>
</body>
</html>
